name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build embedded frontend
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 -timeout 20m ./...
      - name: Load test (full 6h simulation, no race)
        run: go test -count=1 -run TestLoad20Hosts -v ./internal/e2e
      - name: Build
        run: go build ./...
      - name: Agent standalone and repeated install
        run: |
          scripts/build.sh
          scripts/install-agent.sh --center http://127.0.0.1:8787 --allow-http --dry-run --binary ./build/meterly-agent
          scripts/install-agent_test.sh
      - name: Browser and module tests
        run: |
          npx playwright install --with-deps chromium
          npm test
          npm run test:browser
