name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build static binaries
        run: VERSION="${GITHUB_REF_NAME}" scripts/build.sh dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/meterly-agent-linux-amd64 \
            dist/meterly-agent-linux-arm64 \
            dist/meterly-server-linux-amd64 \
            dist/meterly-server-linux-arm64 \
            dist/meterly-linux-amd64.tar.gz \
            dist/meterly-linux-arm64.tar.gz \
            dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
